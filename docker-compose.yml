# Docker Compose - orchestrates multiple containers
# Run with: docker compose up

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15-community
    container_name: fraud-detection-neo4j
    ports:
      - "7474:7474"  # Neo4j Browser (web UI)
      - "7687:7687"  # Bolt protocol (database connection)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/frauddetection123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_max__size=512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "frauddetection123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: fraud-detection-ollama
    ports:
      - "11434:11434"  # Ollama API
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Start server, wait for it to be ready, then pull the model (skips if already cached)
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & PID=$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull llama3.2:1b; wait $PID"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Allow time for model pull on first run

  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-api
    ports:
      - "8000:8000"  # Map host:container ports
    volumes:
      # Mount database and models for persistence
      - ./fraud_detection.db:/app/fraud_detection.db
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      # Neo4j connection
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=frauddetection123
      # Ollama connection
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraud-detection-frontend
    ports:
      - "3000:3000"  # SvelteKit runs on port 3000 with adapter-node
    environment:
      # Tell frontend where to find the API
      - VITE_API_URL=http://localhost:8000
      - ORIGIN=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

# Persistent volumes for data
volumes:
  neo4j_data:
    name: fraud-detection-neo4j-data
  neo4j_logs:
    name: fraud-detection-neo4j-logs
  ollama_data:
    name: fraud-detection-ollama-data

# Network for container communication
networks:
  default:
    name: fraud-detection-network
